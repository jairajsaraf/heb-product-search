name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-api.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Downloads all-MiniLM-L6-v2 from Hugging Face at the pinned revision (scripts/build_index.py).
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t heb-search .
      - run: docker run -d --name heb -p 8080:8080 heb-search
      - name: GET /health
        run: |
          body=$(curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/health)
          echo "$body"
          test "$(echo "$body" | jq -r .status)" = ok
          test "$(echo "$body" | jq -r .commit)" = "${{ github.sha }}"
      - if: failure()
        run: docker logs heb
